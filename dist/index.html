<!doctype html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d171b">
  <meta name="description" content="Descoperă aplicații, site-uri și resurse adventiste în limba română. Explorează catalogul după domeniu sau platformă.">
  <title>adventist.pro — Catalog de proiecte adventiste</title>
  <link rel="icon" href="assets/semn.svg" type="image/svg+xml">
  <link rel="preload" as="font" href="assets/dm-sans-latin.woff2" type="font/woff2" crossorigin>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="catalog.js" defer></script>
  <script src="site-ui.js" defer></script>
  <script src="platform-menu.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#catalog">Sari la catalog</a>
  <main id="acasa">
    <header class="hero site-hero" aria-labelledby="hero-title">
      <div class="wrap feature-shell">
        <!-- shared-identity:start -->
        <div class="feature-identity">
          <a class="brand home" href="#acasa" aria-label="adventist.pro, pagina principală"><img src="assets/semn.svg" width="35" height="35" alt=""><span>adventist<span class="brand-suffix">.pro</span></span></a>
          <a class="church-link header-church" href="https://adventist.ro/" target="_blank" rel="noopener noreferrer" aria-label="Site-ul Bisericii Adventiste de Ziua a Șaptea din România">
            <picture>
              <source media="(max-width: 900px)" srcset="assets/simbol-adventist.svg">
              <img src="assets/biserica-adventista-ro.svg" width="704" height="159" alt="Biserica Adventistă de Ziua a Șaptea din România">
            </picture>
          </a>
        </div>
        <!-- shared-identity:end -->
        <div class="hero-copy">
          <div class="eyebrow"><span data-icon="grid"></span>Catalog digital</div>
          <h1 id="hero-title">Proiecte adventiste,<br><span>într-un singur loc.</span></h1>
          <p>Descoperă aplicații și site-uri pentru studiu, închinare<br class="desktop-break"> și viața comunității adventiste din România.</p>
          <form id="search-form" class="search" role="search">
            <span data-icon="search"></span>
            <label class="sr-only" for="search-input">Caută în catalog</label>
            <input type="search" id="search-input" placeholder="Caută o aplicație, un site sau o resursă…" autocomplete="off" enterkeyhint="search">
            <kbd id="shortcut" aria-hidden="true">/</kbd>
            <button id="clear-search" hidden type="button" aria-label="Șterge căutarea"><span data-icon="x"></span></button>
          </form>
        </div>
        <div class="hero-art" aria-label="Proiecte din catalog">
          <div class="star-field" aria-hidden="true"></div>
          <div class="orbits" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="tile-space">
            <a class="app-tile tile-bible" href="proiecte/mybible/" aria-label="Detalii despre myBible"><img alt="" src="assets/projects/bible-logo.svg"></a>
            <a class="app-tile tile-gift" href="proiecte/zecimi-si-daruri/" aria-label="Detalii despre Zecimi și Daruri"><img alt="" src="assets/projects/daruri-logo.svg"></a>
            <a class="app-tile tile-radio" href="proiecte/radio-vocea-sperantei/" aria-label="Detalii despre Radio Vocea Speranței"><span class="radio-symbol"><img alt="" src="assets/projects/rvs-logo.webp"></span></a>
          </div>
        </div>
      </div>
    </header>
    <section class="wrap" id="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <div class="title-cluster"><h2 id="catalog-title" tabindex="-1">Explorează proiectele</h2><span id="total">6</span></div>
        <div class="catalog-tools">
          <button id="saved-nav" class="saved-nav" aria-pressed="false" type="button"><span data-icon="bookmark"></span><span class="saved-caption">Salvate <span id="saved-num" hidden></span></span></button>
          <div class="platform-control">
            <label class="sr-only" for="platform">Filtrează după platformă</label>
            <select id="platform"><option value="">Toate platformele</option><option value="Web">Web</option><option value="Android">Android</option><option value="iOS">iOS</option></select>
            <button class="platform-trigger" id="platform-trigger" type="button" aria-haspopup="menu" aria-controls="platform-menu" aria-expanded="false" hidden>
              <span class="platform-symbol" data-icon="sliders"></span>
              <span id="platform-label">Toate platformele</span>
              <span class="platform-chevron" data-icon="chevron"></span>
            </button>
            <div class="platform-menu" id="platform-menu" role="menu" aria-label="Filtrează după platformă" hidden></div>
          </div>
        </div>
      </div>
      <div id="categories" role="group" aria-label="Categorii de proiecte"></div>
      <span id="result-status" class="sr-only" role="status"></span>
      <div id="cards" class="cards"></div>
      <div id="empty" hidden class="empty"><span class="empty-icon" data-icon="search"></span><h3 id="empty-title"></h3><p id="empty-description"></p><button class="dark-button" id="reset">Arată toate proiectele</button></div>
    </section>
  </main>
  <footer>
    <div class="wrap footer-inner">
      <a class="brand home" href="#acasa"><img src="assets/semn.svg" width="25" height="25" alt=""><span>adventist<span class="brand-suffix">.pro</span></span></a>
      <button class="about" type="button">Despre proiect</button>
      <div class="footer-end">
        <a class="church-link footer-church" href="https://adventist.ro/" target="_blank" rel="noopener noreferrer"><img src="assets/biserica-adventista-ro.svg" width="704" height="159" alt="Biserica Adventistă de Ziua a Șaptea din România"></a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activează tema luminoasă" hidden>
          <span class="theme-sun" data-icon="sun"></span><span class="theme-moon" data-icon="moon"></span>
        </button>
      </div>
    </div>
  </footer>
  <dialog id="details" aria-labelledby="dialog-title">
    <div id="dialog-content"></div>
    <button id="close-dialog" class="round-button" type="button" aria-label="Închide detaliile"><span data-icon="x"></span></button>
  </dialog>
  <div id="notice" role="status" class="notice" hidden></div>
</body>
</html>
